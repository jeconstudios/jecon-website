name: Deploy jecon-website to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build site (Astro)
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          set -e
          cat build.log
          if [ $status -ne 0 ]; then
            echo "::group::Build failed - tail of output (also sent as annotations below)"
            tail -n 60 build.log
            echo "::endgroup::"
            tail -n 15 build.log | while IFS= read -r line; do
              esc=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::$esc"
            done
            exit $status
          fi
        env:
          # These PUBLIC_* values are baked into the static site at build time (Astro
          # requirement — there is no server to read them from at runtime). They are
          # safe to expose client-side by design: Supabase access is enforced by Row
          # Level Security, not by keeping the anon key secret. See .env.example.
          PUBLIC_SUPABASE_URL: https://jpvuirvxcplvtqijccem.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_p18fvRrV3T9CmaecfVTdbw_-Q7cVWZq

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
