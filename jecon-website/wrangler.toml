# Cloudflare Workers (static assets) deployment config.
# Deploy with: npx wrangler deploy   (after `npm run build`)
# This serves the Astro `dist/` output directly from a Worker, per the spec's
# "Workers static assets, not Pages" requirement — every push to main can redeploy
# this via a GitHub Actions workflow once the repo is connected in the Cloudflare
# dashboard (Workers & Pages > your worker > Settings > Builds).

name = "jecon-website"
main = "worker/entry.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Uncomment once app.jeconllc.com (Next.js) exists — this repo only serves the
# marketing site. DNS for jeconllc.com and its CNAME slot for app.jeconllc.com
# are managed separately in the Cloudflare dashboard.
# [[routes]]
# pattern = "jeconllc.com/*"
# zone_name = "jeconllc.com"
